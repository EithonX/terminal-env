name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38e # v2.0.0
        env:
          SHELLCHECK_OPTS: -x
        with:
          version: v0.11.0
          severity: warning
          check_together: 'yes'
          scandir: './scripts'
          additional_files: >-
            install.sh
            uninstall.sh
            tests/smoke.sh
            dot_local/bin/executable_terminal-backup
            dot_local/bin/executable_terminal-deps
            dot_local/bin/executable_terminal-doctor
            dot_local/bin/executable_terminal-rollback
            dot_local/bin/executable_terminal-update

  unix:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: server
          - os: ubuntu-latest
            profile: workstation
          - os: macos-latest
            profile: workstation
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux validation shell
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Source smoke
        shell: bash
        run: bash ./tests/smoke.sh
      - name: Installer dry run
        shell: bash
        run: bash ./install.sh --dry-run --profile "${{ matrix.profile }}" --no-shell-change

  windows:
    name: windows / workstation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell source validation
        shell: pwsh
        run: .\tests\smoke.ps1
      - name: Workstation installer dry run
        shell: pwsh
        run: .\install.ps1 -DryRun -Profile workstation -NoFont -NoTerminalConfig
      - name: Minimal installer dry run
        shell: pwsh
        run: .\install.ps1 -DryRun -Profile minimal -NoFont -NoTerminalConfig
