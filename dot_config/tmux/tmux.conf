set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard external
set -as terminal-features ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0b0f14,fg=#63717d"
set -g status-left-length 30
set -g status-right-length 40
set -g status-left "#[fg=#7dd3fc,bold] #S #[fg=#26323d]│#[default]"
set -g status-right "#[fg=#63717d]#(whoami)@#H  %H:%M #[default]"
set -g window-status-separator ""
set -g window-status-format "#[fg=#63717d] #I #W  "
set -g window-status-current-format "#[fg=#d8e1e8,bold] #I #W #[fg=#7dd3fc]• #[default]"
set -g pane-border-style "fg=#18212b"
set -g pane-active-border-style "fg=#7dd3fc"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
