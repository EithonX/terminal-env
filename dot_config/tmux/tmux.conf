set -g mouse on
set -g history-limit 100000
# Leave enough time for SSH terminal-query replies to be consumed by tmux.
set -sg escape-time 500
set -g focus-events on
set -g set-clipboard external
set -as terminal-features ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0a0e13,fg=#707c88"
set -g status-left-length 30
set -g status-right-length 40
set -g status-left "#[fg=#a2acb7] #S #[fg=#28323d]│#[default]"
set -g status-right "#[fg=#707c88]#(whoami)@#H  %H:%M #[default]"
set -g window-status-separator ""
set -g window-status-format "#[fg=#707c88] #I #W  "
set -g window-status-current-format "#[fg=#e6ebf0] #I #W #[fg=#7cc4e4]• #[default]"
set -g pane-border-style "fg=#28323d"
set -g pane-active-border-style "fg=#7cc4e4"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
